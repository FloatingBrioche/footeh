{% extends "layout.html" %}

{% block title %}
Groups
{% endblock %}

{% block main %}

{% if groups %}
    {% for group in groups %}
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ group.name }}</h5>
            </div>
        </div>
    {% endfor %}
{% else %}
    <p>You are not a member of any groups.</p> 
    <p>Why not <a href="/groups/create">create a group</a> or <a href="/groups/join">join one</a>?</p>
{% endif %}

{% endblock %}
